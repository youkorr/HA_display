#############################################################

#############################################################
i2c:
  - id: i2c_bus
    sda: GPIO7
    scl: GPIO8
    scan: true
    frequency: 400kHz

# -------------------------------------------
# Audio
# ------------------------------------------- 

audio_dac:
  - platform: es8311
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 16000
    use_microphone: True

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

speaker:
  - platform: i2s_audio
    i2s_audio_id: i2s_output
    id: p4_speaker
    i2s_dout_pin: GPIO9
    dac_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: stereo
    audio_dac: es8311_dac
  - platform: mixer
    id: mixer_speaker_id
    output_speaker: p4_speaker
    source_speakers:
      - id: announcement_spk_mixer_input
      - id: media_spk_mixer_input
  - platform: resampler
    id: media_spk_resampling_input
    output_speaker: media_spk_mixer_input
  - platform: resampler
    id: announcement_spk_resampling_input
    output_speaker: announcement_spk_mixer_input

media_player:
  - platform: speaker
    name: "Desk Pro"
    id: Desk_Media
    media_pipeline:
        speaker: media_spk_resampling_input
        num_channels: 2
    announcement_pipeline:
        speaker: announcement_spk_resampling_input
        num_channels: 1
    on_announcement:
      - if:
          condition:
            - microphone.is_capturing:
          then:
            - micro_wake_word.stop
            - voice_assistant.stop
      - switch.turn_on: audio_amplifier
      - delay: 100ms
    on_idle:
      - delay: 100ms
      - switch.turn_off: audio_amplifier
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - micro_wake_word.start       
#microphone:
  #- platform: i2s_audio
    #id: p4_microphone
    #i2s_din_pin: GPIO11
    #sample_rate: 16000
    #bits_per_sample: 16bit
    #adc_type: external  

microphone:
  - platform: i2s_audio
    id: p4_microphone
    i2s_audio_id: i2s_output
    i2s_mode: primary
    adc_type: external
    i2s_din_pin: GPIO11 #// may be different on your board, for example GPIO53
    sample_rate: 16000
    #bits_per_channel: 16bit
    channel: stereo




micro_wake_word:
  id: my_wake_word
  models:
    - okay_nabu
  on_wake_word_detected:
    then:
      #- lvgl.page.show: listening_page 
      - light.turn_on: backlight
      - logger.log: "Wake word detected"
      - voice_assistant.start:
          wake_word: !lambda return wake_word;
                                                                                     
voice_assistant:
  microphone: p4_microphone
  media_player: Desk_Media
  micro_wake_word: my_wake_word
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  conversation_timeout: 300s
  on_end:
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                media_player.is_playing:
    - micro_wake_word.start:
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:

    
switch:
  - platform: gpio
    pin: GPIO20 
    name: "Audio Amplifier"
    id: audio_amplifier
    restore_mode: ALWAYS_OFF    


sensor:
  - platform: adc
    name: "Battery voltage"
    pin: GPIO52
    update_interval: 30s
    attenuation: 12dB
    samples: 10
  - platform: debug
    cpu_frequency:
      name: CPU Frequency  

# SRAM Usage sensor for ESP32-P4
  # 1. Total SRAM memory usage
  - platform: template
    name: "SRAM Usage"
    id: sram_usage
    icon: mdi:memory
    unit_of_measurement: "KB"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      // Total SRAM size for ESP32-S3 = 512KB
      const size_t total_sram = 512 * 1024;
      size_t free_sram = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
      size_t used_sram = total_sram - free_sram;
      return used_sram / 1024.0; // Return used memory in KB


  # 2. PSRAM Usage sensor for ESP32-P4 (32MB)
  - platform: template
    name: "PSRAM Usage"
    id: psram_usage
    icon: mdi:memory
    unit_of_measurement: "MB"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      // Total PSRAM size for ESP32-P4 = 32MB
      const size_t total_psram = 32 * 1024 * 1024;
      size_t free_psram = heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
      
      // If PSRAM is not available, return 0
      if (heap_caps_get_total_size(MALLOC_CAP_SPIRAM) == 0) {
        return 0.0;
      }
      
      size_t used_psram = total_psram - free_psram;
      return used_psram / (1024.0 * 1024.0); // Return used memory in MB



  - platform: internal_temperature
    name: "ESP32 Internal Temperature"
    id: esp32_temperature
    update_interval: 30s


  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 30s
    unit_of_measurement: "dBm"

    
number:

  - platform: usb_display
    name: "Volume écran USB"
    
  - platform: template
    id: brightness_slider
    name: "Luminosité Écran"
    icon: "mdi:brightness-6"
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 50
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x > 0;'
            then:
              - light.turn_on:
                  id: backlight
                  brightness: !lambda 'return x / 100.0;'
            else:
              - light.turn_off:
                  id: backlight

  - platform: template
    name: Veille de l ecran
    id: auto_off
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 600
    step: 10
    initial_value: 0
    mode: slider
    unit_of_measurement: s
    icon: mdi:television-off
    on_value:
      # Prise en compte immediate : le compte a rebours repart avec la
      # nouvelle valeur au lieu d'attendre le prochain toucher.
      - lambda: 'id(screen_off_delay) = (int) x;'
      - script.execute: screen_timeout
    #on_value:
      #then:
        #- lambda: |-
            #// Met à jour la variable globale avec la valeur du slider en secondes
            #id(screen_off_timer) = x;
            #ESP_LOGD("screen", "Délai Screen Off défini à : %d secondes", (int)x);
script:
  - id: screen_timeout
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(screen_off_delay) > 0;'
          then:
            - delay: !lambda 'return id(screen_off_delay) * 1000;'
            - light.turn_off: backlight
            # usb_display.sleep: udisp
    

globals:
  - id: screen_off_delay
    type: int
    restore_value: no
    initial_value: '0'


output:
  # Backlight LED
  - platform: ledc
    pin: GPIO23
    id: GPIO23
    frequency: 100Hz
    min_power: 0.03
    zero_means_zero: true

light:
  - platform: monochromatic
    output: GPIO23
    name: Backlight
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    
touchscreen:
  - platform: gsl3680
    id: my_touch
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    calibration:
      x_min: 0
      x_max: 800
      y_min: 0
      y_max: 1280
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false 
    on_touch:
      # Rallume, et relance le compte a rebours depuis zero. Le script est en
      # mode "restart", donc un toucher pendant qu'il attend annule l'attente
      # en cours et en commence une neuve.
      - light.turn_on: backlight
      - script.execute: screen_timeout
      #- usb_display.sleep: udisp
        
      
    
display:
  - platform: mipi_dsi
    model: JC8012P4A1
    id: main_screen
    pixel_mode: 16
    update_interval: never
    auto_clear_enabled: false
    #rotation: 0

usb_display:
  #id: udisp
  display_id: main_screen
  touchscreen_id: my_touch
  port: 5000
  width: 800
  height: 1280
  rotation: 0
  vendor_id: 0x303A
  #product_id: 0x2987
  product_id: 0x2986           # <- la seule correction nécessaire
  sender_drive: false
  max_frame_bytes: 400000
  jpeg_quality: 8
  max_fps: 60
  manufacturer: Espressif
  product: ESP_Extern_Screen
  serial: "012-2021"
  speaker_id: p4_speaker
  on_audio_start:
    - switch.turn_on: audio_amplifier
    - micro_wake_word.stop
  on_audio_stop:
    - micro_wake_word.start
    - switch.turn_off: audio_amplifier
    